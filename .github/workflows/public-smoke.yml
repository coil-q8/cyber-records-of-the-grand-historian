name: Public deployment smoke test

on:
  workflow_dispatch:
    inputs:
      community:
        description: 'Run temporary-account contribution and moderation tests'
        type: boolean
        default: false
      password_policy:
        description: 'Verify 8-character password boundaries with a temporary member account'
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public Cloudflare deployment
        env:
          CYBER_ARCHIVE_URL: https://cyber-records-of-the-grand-historian.cyber-records-of-the-grand-historian.workers.dev
          CYBER_BROWSER_PATH: /usr/bin/google-chrome
        run: npm run test:deployment

      - name: Verify password length boundaries
        if: ${{ inputs.password_policy }}
        env:
          CYBER_ARCHIVE_URL: https://cyber-records-of-the-grand-historian.cyber-records-of-the-grand-historian.workers.dev
          CYBER_BROWSER_PATH: /usr/bin/google-chrome
        run: npm run test:password-policy

      - name: Verify account and editorial workflow
        if: ${{ inputs.community }}
        env:
          CYBER_ARCHIVE_URL: https://cyber-records-of-the-grand-historian.cyber-records-of-the-grand-historian.workers.dev
          CYBER_BROWSER_PATH: /usr/bin/google-chrome
          CYBER_TEST_ADMIN_USERNAME: ${{ secrets.CYBER_TEST_ADMIN_USERNAME }}
          CYBER_TEST_ADMIN_PASSWORD: ${{ secrets.CYBER_TEST_ADMIN_PASSWORD }}
        run: npm run test:community
